name: Daily AI report - collect

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect data and generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ai_open_source_daily --root . --limit 20

      - name: Verify today's collection is complete
        run: |
          report_day=$(TZ=Asia/Shanghai date +%F)
          test -s "reports/$report_day.md"
          test -s "data/snapshots/$report_day.json"

      - name: Save collected files to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B daily-report-staging
          git add reports data/snapshots
          if git diff --cached --quiet; then
            echo "No report changes to stage."
          else
            git commit -m "chore: collect daily AI report $(TZ=Asia/Shanghai date +%F)"
          fi
          git push --force origin HEAD:daily-report-staging
