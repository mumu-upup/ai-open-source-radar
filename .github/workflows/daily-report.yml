name: Daily AI open-source report

on:
  schedule:
    # 01:07 UTC = 09:07 Asia/Shanghai; offset from the top of the hour.
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ai_open_source_daily --root . --limit 20

      - name: Commit report and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/snapshots
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily AI report $(TZ=Asia/Shanghai date +%F)"
          git push
